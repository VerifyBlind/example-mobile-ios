name: VerifyBlindDemo
options:
  bundleIdPrefix: com.verifyblind
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: tr
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_BITCODE: NO
    DEVELOPMENT_TEAM: $(APPLE_TEAM_ID)
    SWIFT_STRICT_CONCURRENCY: minimal

configs:
  Debug: debug
  Release: release

# SwiftPM bağımlılığı: VerifyBlind iOS SDK (App Attest İÇERMEZ — v2.1.0+; sonuçta `token` — v2.3.1+).
packages:
  VerifyBlind:
    url: https://github.com/VerifyBlind/sdk-ios
    from: 2.3.1

targets:
  VerifyBlindDemo:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(IOS_BUNDLE_ID)
        CURRENT_PROJECT_VERSION: $(BUILD_NUMBER)
        # App Store'da 1.0.0 onaylandıktan sonra o pre-release treni KAPANIR: TestFlight
        # "The train version '1.0.0' is closed for new build submissions" ile reddeder ve bu
        # repoya yapılan HER push'ta CI kırmızıya döner. Yeni bir build çıkacaksa bu satır
        # yayınlanmış son sürümden büyük olmalı. (CURRENT_PROJECT_VERSION'ı CI kendisi artırır;
        # elle yönetilmesi gereken tek alan bu.)
        MARKETING_VERSION: "1.0.1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: YES
        # Seyrek Info.plist: yalnızca özel anahtarlar (ITSAppUsesNonExemptEncryption).
        # GENERATE_INFOPLIST_FILE standart anahtarları (ikon/orientation/versiyon) üstüne birleştirir.
        INFOPLIST_FILE: Config/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: VerifyBlind Demo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    configFiles:
      Debug: Config/Release.xcconfig
      Release: Config/Release.xcconfig
    dependencies:
      - package: VerifyBlind
        product: VerifyBlind
